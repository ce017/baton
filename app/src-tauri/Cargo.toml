[package]
name = "baton"
version = "0.3.2"
description = "Baton: a shared workspace for people and their Claudes"
authors = ["ceo"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "baton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-opener = "2"
ureq = "2"
dirs = "6"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
